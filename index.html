    // Konversi Hex ke array RGB [R, G, B]
    const hexToRgb = (hex) =>
      [1, 3, 5].map((index) => parseInt(hex.slice(index, index + 2), 16));

    // Menentukan warna teks kontras (hitam/putih) di atas warna latar tertentu
    const getContrastTextColor = (hex) => {
      const [r, g, b] = hexToRgb(hex);
      const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
      return luminance > 150 ? '#0F172A' : '#FFFFFF';
    };

          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"

      );
    }

    function Section({ id, icon, title, desc, children }) {

        <section id={id} className="mb-16">

          </h2>
          {desc && <p className="text-mute max-w-2xl mb-6">{desc}</p>}
          {children}
        </section>
      );
    }

    function ActionLink({ href, children, primary, notify, className = '' }) {
      const handleClick = (e) => {
        if (href === '#') {
          e.preventDefault();
          notify('Link masih placeholder, ganti dengan URL asli.');
        }
      };

      const variantClass = primary
        ? 'bg-[#0060BF] text-white hover:bg-[#004f9e]'
        : 'border border-line hover:bg-soft hover:text-brand';

      return (
        <a
          href={href}
          onClick={handleClick}
          target="_blank"
          rel="noopener noreferrer"
          className={`inline-flex items-center justify-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium transition active:scale-95 ${variantClass} ${className}`}
        >
          {children}
        </a>
      );
    }

    // 4. KOMPONEN UTAMA APLIKASI

    function App() {

        document.documentElement.classList.contains('dark')

      const toastTimerRef = useRef(null);

      // Menampilkan notifikasi toast sementara
      const showNotification = (message) => {
        setToastMessage(message);
        clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(() => {
          setToastMessage('');
        }, 2200);
      };

      // Sinkronisasi mode gelap/terang ke <html> dan localStorage
      useEffect(() => {
        document.documentElement.classList.toggle('dark', isDark);
        try {
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
        } catch (error) {
          // Abaikan jika gagal menyimpan tema
        }
      }, [isDark]);

      // Deteksi section yang sedang aktif saat scroll
      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                setActiveSection(entry.target.id);
              }
            });
          },
          { rootMargin: '-25% 0px -65% 0px' }
        );

        NAV_ITEMS.forEach((item) => {
          const element = document.getElementById(item.id);
          if (element) observer.observe(element);
        });

        return () => observer.disconnect();
      }, []);

      // Menyalin teks (kode warna) ke clipboard
      const copyToClipboard = async (text) => {
        try {
          await navigator.clipboard.writeText(text);
        } catch (error) {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          try {
            document.execCommand('copy');
          } catch (_) {}
          textarea.remove();
        }
        showNotification(`Kode warna ${text} tersalin!`);
      };

          selectedCategory === 'Semua' || asset.category === selectedCategory;

          .toLowerCase()
          .includes(searchQuery.toLowerCase());
        return matchCategory && matchQuery;

                      <ActionLink href={EXTERNAL_LINKS.pic} notify={showNotification}>
                        <span>Hubungi PIC</span>
                        <Icon name="ext" />
                      </ActionLink>
                    </div>
                  </div>
                </div>
              </section>

              {/* SECTION 2: LOGO & IDENTITAS VISUAL */}
              <Section
                id="logo"
                icon="image"
                title="Logo & Identitas Visual"
                desc="Unduh logo resmi sesuai kebutuhan. Setiap versi sudah disiapkan untuk jenis latar yang berbeda."
              >
                <div className="grid sm:grid-cols-2 gap-4">
                  {LOGO_VARIANTS.map((logo) => (
                    <div key={logo.title} className={`${cardBaseClass} overflow-hidden`}>
                      <div className={`h-48 grid place-items-center ${logo.bgClass}`}>
                        <img
                          src={logo.src}
                          alt={logo.title}
                          className="h-40 object-contain"
                        />
                      </div>
                      <div className="p-4">
                        <div className="font-semibold">{logo.title}</div>
                        <div className="text-sm text-mute mb-3">{logo.desc}</div>
                        <div className="flex gap-2 flex-wrap">
                          <ActionLink href={logo.pngUrl} notify={showNotification} primary>
                            <Icon name="dl" />
                            <span>Download PNG</span>
                          </ActionLink>
                          <ActionLink href={logo.svgUrl} notify={showNotification}>
                            <Icon name="dl" />
                            <span>Download SVG</span>
                          </ActionLink>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Panduan Do's & Don'ts */}
                <div className="grid md:grid-cols-2 gap-4 mt-6">
                  <div className="rounded-2xl border border-emerald-500/30 bg-emerald-500/5 p-5">
                    <div className="font-semibold text-emerald-600 dark:text-emerald-400 mb-3">
                      Do’s
                    </div>
                    <ul className="space-y-2 text-sm">
                      {LOGO_DOS.map((rule) => (
                        <li key={rule} className="flex gap-2">
                          <span className="text-emerald-500 mt-0.5">
                            <Icon name="check" />
                          </span>
                          <span>{rule}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  <div className="rounded-2xl border border-red-500/30 bg-red-500/5 p-5">
                    <div className="font-semibold text-red-600 dark:text-red-400 mb-3">
                      Don’ts
                    </div>
                    <ul className="space-y-2 text-sm">
                      {LOGO_DONTS.map((rule) => (
                        <li key={rule} className="flex gap-2">
                          <span className="text-red-500 mt-0.5">
                            <Icon name="x" />
                          </span>
                          <span>{rule}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              </Section>

              {/* SECTION 3: PALET WARNA */}
              <Section
                id="warna"
                icon="palette"
                title="Palet Warna"
                desc="Klik kartu atau kode Hex untuk menyalin ke clipboard."
              >
                <div className="grid sm:grid-cols-2 gap-4">
                  {COLOR_PALETTE.map((color) => (
                    <button
                      key={color.role}
                      onClick={() => copyToClipboard(color.hex)}
                      className={`${cardBaseClass} text-left overflow-hidden group`}
                    >
                      <div
                        className="h-28 p-4 flex justify-between items-start"
                        style={{
                          background: color.hex,
                          color: getContrastTextColor(color.hex),
                        }}
                      >
                        <span className="text-xs font-semibold uppercase tracking-wide opacity-80">
                          {color.role}
                        </span>
                        <span className="opacity-0 group-hover:opacity-100 transition">
                          <Icon name="copy" className="w-5 h-5" />
                        </span>
                      </div>
                      <div className="p-4">
                        <div className="font-semibold">{color.name}</div>
                        <div className="flex gap-3 text-sm mt-1">
                          <code className="font-semibold text-brand">{color.hex}</code>
                          <span className="text-mute">
                            RGB {hexToRgb(color.hex).join(', ')}
                          </span>
                        </div>
                        <div className="text-sm text-mute mt-2">{color.usage}</div>
                      </div>
                    </button>
                  ))}
                </div>
              </Section>

              {/* SECTION 4: TIPOGRAFI */}
              <Section
                id="tipografi"
                icon="type"
                title="Tipografi"
                desc="Dua keluarga font untuk semua materi: heading yang tegas dan body yang nyaman dibaca."
              >
                <div className="grid sm:grid-cols-2 gap-4 mb-4">
                  <div className={`${cardBaseClass} p-5`}>
                    <div className="text-xs text-mute mb-1">Heading Font</div>
                    <div className="font-head font-extrabold text-5xl text-brand">Aa</div>
                    <div className="font-head font-bold text-lg mt-2">Plus Jakarta Sans</div>
                    <div className="text-sm text-mute mb-3">Bold · ExtraBold</div>
                    <ActionLink
                      href="https://fonts.google.com/specimen/Plus+Jakarta+Sans"
                      notify={showNotification}
                    >
                      <Icon name="dl" />
                      <span>Download Font Family</span>
                    </ActionLink>
                  </div>

                  <div className={`${cardBaseClass} p-5`}>
                    <div className="text-xs text-mute mb-1">Body Font</div>
                    <div className="font-sans font-medium text-5xl text-brand">Aa</div>
                    <div className="font-medium text-lg mt-2">Inter</div>
                    <div className="text-sm text-mute mb-3">Regular · Medium</div>
                    <ActionLink
                      href="https://fonts.google.com/specimen/Inter"
                      notify={showNotification}
                    >
                      <Icon name="dl" />
                      <span>Download Font Family</span>
                    </ActionLink>
                  </div>
                </div>

                {/* Hierarki Ukuran Font */}
                <div className={`${cardBaseClass} divide-y divide-line`}>
                  {TYPOGRAPHY_SCALE.map((item) => (
                    <div
                      key={item.level}
                      className="p-5 grid sm:grid-cols-[110px_1fr] gap-2 sm:gap-6 items-center"
                    >
                      <div>
                        <div className="font-semibold text-sm">{item.level}</div>
                        <div className="text-xs text-mute">{item.spec}</div>
                      </div>
                      <div className={item.className}>{item.sample}</div>
                    </div>
                  ))}
                </div>
              </Section>

              {/* SECTION 5: TEMPLATE & ASSET LIBRARY */}
              <Section
                id="aset"
                icon="lib"
                title="Template & Asset Library"
                desc="Cari dan filter template yang kamu butuhkan."
              >
                {/* Search Bar & Filter Kategori */}
                <div className="flex flex-col sm:flex-row gap-3 mb-5">
                  <div className="relative flex-1">
                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-mute">
                      <Icon name="search" />
                    </span>
                    <input
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Cari template atau aset…"
                      className="w-full bg-card border border-line rounded-lg pl-9 pr-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#0060BF]/50"
                    />
                  </div>
                  <div className="flex gap-2 flex-wrap">
                    {ASSET_CATEGORIES.map((category) => {
                      const isSelected = selectedCategory === category;
                      return (
                        <button
                          key={category}
                          onClick={() => setSelectedCategory(category)}
                          className={`px-3 py-2 rounded-lg text-sm font-medium border transition ${
                            isSelected
                              ? 'bg-[#0060BF] text-white border-[#0060BF]'
                              : 'border-line text-mute hover:text-fg hover:bg-soft'
                          }`}
                        >
                          {category}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Grid Kartu Aset */}
                <div className="grid sm:grid-cols-2 gap-4">
                  {filteredAssets.map((asset) => (
                    <div key={asset.title} className={`${cardBaseClass} p-5 flex flex-col`}>
                      <div className="flex justify-between items-start gap-2 mb-2">
                        <span className="text-xs font-semibold text-brand bg-soft rounded-full px-2.5 py-1">
                          {asset.category}
                        </span>
                        <span className="text-xs text-mute">{asset.tag}</span>
                      </div>
                      <div className="font-semibold">{asset.title}</div>
                      <p className="text-sm text-mute mt-1 mb-4 flex-1">{asset.desc}</p>
                      <div>
                        <ActionLink href={asset.url} notify={showNotification} primary>
                          <Icon name={asset.icon} />
                          <span>{asset.buttonLabel}</span>
                        </ActionLink>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Empty State jika pencarian tidak ditemukan */}
                {filteredAssets.length === 0 && (
                  <div className="text-center text-mute py-12 border border-dashed border-line rounded-2xl">
                    Tidak ada aset yang cocok. Coba kata kunci atau kategori lain.
                  </div>
                )}
              </Section>

              {/* Footer */}
              <footer className="border-t border-line pt-6 text-sm text-mute">
                © 2026 Orcavala · Divisi PDD Sistem Telekomunikasi
              </footer>
            </div>
          </main>

          {/* Notifikasi Toast */}
          <div
            className={`fixed left-1/2 -translate-x-1/2 z-50 transition-all duration-300 ${
              toastMessage
                ? 'opacity-100 translate-y-0'
                : 'opacity-0 translate-y-3 pointer-events-none'
            }`}
            style={{ bottom: 'calc(1.5rem + env(safe-area-inset-bottom, 0px))' }}
          >
            <div className="flex items-center gap-2 bg-[#02244A] text-white text-sm font-medium rounded-full px-4 py-2.5 shadow-xl">
              <Icon name="check" />
              <span>{toastMessage}</span>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
